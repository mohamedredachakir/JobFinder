server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobfinder}
    username: ${DB_USER:jobfinder}
    password: ${DB_PASSWORD:jobfinder}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
    open-in-view: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}

app:
  jwt:
    secret: ${JWT_SECRET:change_me_change_me_change_me_change_me_change_me_change_me_change_me_change_me_1234567890}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000

external:
  adzuna:
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
  jsearch:
    api-key: ${JSEARCH_API_KEY:}
  themuse:
    api-key: ${THEMUSE_API_KEY:}
